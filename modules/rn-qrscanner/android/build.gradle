buildscript {
  repositories { google(); mavenCentral() }
}
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
// Library codegen is gated on the com.facebook.react plugin being applied, not
// on com.android.library: ReactPlugin.apply() registers
// project.pluginManager.withPlugin("com.android.library") { configureCodegen(..., isLibrary = true) }.
// Without this, NativeDaakQrScannerSpec is never generated and the module
// cannot compile. Task 4 shipped this omission as a Critical; it is pinned by
// apps/mobile/src/__tests__/qrScanner.test.ts.
apply plugin: 'com.facebook.react'

repositories { google(); mavenCentral() }

android {
  namespace 'dev.darshit.daak.qrscanner'
  compileSdkVersion 35
  defaultConfig { minSdkVersion 26 }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // ScannerActivity: CameraX for the preview+analysis pipeline, zxing core for
  // decoding. Versions are pinned rather than floating so the library builds
  // the same on every machine.
  implementation 'androidx.camera:camera-core:1.3.4'
  implementation 'androidx.camera:camera-camera2:1.3.4'
  implementation 'androidx.camera:camera-lifecycle:1.3.4'
  implementation 'androidx.camera:camera-view:1.3.4'
  // ScannerActivity uses ComponentActivity + registerForActivityResult
  // (androidx.activity) and ContextCompat (androidx.core). Declared explicitly,
  // not left to transitive resolution -- the review flagged this.
  implementation 'androidx.activity:activity-ktx:1.9.3'
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'com.google.zxing:core:3.5.3'
}
