# CI does not sign. The Android keystore and the Apple certificate stay on this
# host. So this workflow holds no signing secret and no build job. Ruling R27
# forbids the keystore and the Apple certificate from reaching GitHub.
#
# This workflow creates one draft Release when a version tag lands. The host
# builds and signs the three artifacts afterwards. The host then attaches each
# artifact with `gh release upload`.
name: release

on:
  push:
    tags:
      - 'v*'

# The preflight job only reads. Only the draft job needs contents: write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (version check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node scripts/stamp-version.mjs --check
      - name: Check that the tag matches release/version.json
        run: |
          test "v$(node -p "require('./release/version.json').version")" = "$GITHUB_REF_NAME"

  draft:
    name: Draft Release
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create the draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Daak $GITHUB_REF_NAME" --generate-notes
