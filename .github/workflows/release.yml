# This workflow does three things.
#
# 1. A pushed version tag creates one draft Release.
# 2. A manual run (workflow_dispatch) builds unsigned Android APKs from the
#    F-Droid recipe steps. The build job holds no secret.
# 3. The sign job signs the APKs in the environment "release". It never checks
#    out the repository. The Apple certificate stays on the local machine.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA to build
        required: true
        type: string

# The preflight job only reads. Only the draft job needs contents: write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (version check)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: node scripts/stamp-version.mjs --check
      - name: Check that the tag matches release/version.json
        run: |
          test "v$(node -p "require('./release/version.json').version")" = "$GITHUB_REF_NAME"

  draft:
    name: Draft Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Daak $GITHUB_REF_NAME" --generate-notes

  android-unsigned:
    name: Android unsigned (${{ matrix.leg }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: arm64-v8a, archs: arm64-v8a }
          - { leg: armeabi-v7a, archs: armeabi-v7a }
          - { leg: universal, archs: 'armeabi-v7a,arm64-v8a' }
    env:
      # The F-Droid build path and tool homes. Rust embeds these paths.
      BUILD_DIR: /home/vagrant/build/dev.darshit.daak
      CARGO_HOME: /home/vagrant/.cargo
      RUSTUP_HOME: /home/vagrant/.rustup
      REF: ${{ inputs.ref || github.sha }}
    steps:
      - name: Make the F-Droid build path
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a full commit SHA"; exit 1; }
          sudo mkdir -p /home/vagrant
          sudo chown "$USER" /home/vagrant
          mkdir -p /home/vagrant/build
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" "$BUILD_DIR"
          git -C "$BUILD_DIR" checkout --detach "$REF"
          git -C "$BUILD_DIR" merge-base --is-ancestor "$REF" origin/main || { echo "ref is not on main"; exit 1; }
          echo "Built commit: $REF" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Install the tools
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          sudo npm install -g pnpm@9.12.0
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.1.12297006" "platforms;android-35" "build-tools;35.0.0"
          rustup toolchain install 1.98.1 --profile minimal \
            --target aarch64-linux-android --target armv7-linux-androideabi
          echo "$RUSTUP_HOME/toolchains/1.98.1-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
      - name: Prepare the build (the recipe prebuild)
        working-directory: /home/vagrant/build/dev.darshit.daak
        run: |
          sed -i -e 's/^reactNativeArchitectures=.*/reactNativeArchitectures=${{ matrix.archs }}/' \
            apps/mobile/android/gradle.properties
          pnpm install --frozen-lockfile
          ( cd apps/mobile/node_modules/@react-native/gradle-plugin \
            && find . -name '*.kt*' -exec sed -i 's/(17)/(21)/;s/_17/_21/' {} + )
          cargo fetch --locked
      - name: Build the Rust library (the recipe build)
        working-directory: /home/vagrant/build/dev.darshit.daak
        env:
          DAAK_CARGO_OFFLINE: '0'
        run: bash apps/mobile/scripts/gen-android-ffi.sh
      - name: Build the unsigned APK
        working-directory: /home/vagrant/build/dev.darshit.daak/apps/mobile/android
        run: ./gradlew assembleRelease
      - name: Collect the APK
        working-directory: /home/vagrant/build/dev.darshit.daak
        run: |
          set -euo pipefail
          version="$(jq -r .version release/version.json)"
          mkdir -p "$RUNNER_TEMP/out"
          cp "apps/mobile/android/app/build/outputs/apk/release/daak-${version}-${{ matrix.leg }}.apk" "$RUNNER_TEMP/out/"
          sha="$(sha256sum "$RUNNER_TEMP/out/"*.apk)"
          echo "$sha"
          printf '%s\n' '```' "$sha" '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.leg }}
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error

  android-sign:
    name: Sign the Android APKs
    needs: android-unsigned
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      EXPECTED_SIGNER: 0d825cdc0069c9176bc9232f4be5a5266d51888f54c8fc2ff123c5b41f8f9df5
    steps:
      # No checkout. This job runs no repository code.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-*
          path: unsigned
          merge-multiple: true
      - name: Sign and check the signer
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$KEYSTORE_BASE64" ] && [ -n "$KS_PASS" ] || { echo "the secrets are missing"; exit 1; }
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          [ -x "$apksigner" ] || { echo "apksigner 35.0.0 not found"; exit 1; }
          ks="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          mkdir signed
          count=0
          for f in unsigned/*.apk; do
            out="signed/$(basename "$f")"
            "$apksigner" sign --ks "$ks" --ks-key-alias daak \
              --ks-pass env:KS_PASS --key-pass env:KS_PASS \
              --v4-signing-enabled false --out "$out" "$f"
            got="$("$apksigner" verify --print-certs "$out" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
            [ "$got" = "$EXPECTED_SIGNER" ] || { echo "signer mismatch for $out"; rm -f "$ks"; exit 1; }
            count=$((count + 1))
          done
          rm -f "$ks"
          [ "$count" -eq 3 ] || { echo "expected 3 APKs, found $count"; exit 1; }
          sha256sum signed/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-signed
          path: signed/*.apk
          if-no-files-found: error
