name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CDDL_CODEGEN_REV: 2fa208e79be241adf2e9fe0e36af18e60bc0943b

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  js:
    name: JS (typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # packages/core's daemon contract suite drives the real daakd binary over
      # a Unix socket. Without this step that suite silently SKIPS and the
      # in-process/daemon parity gate never runs.
      - run: cargo build -p daakd
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck test

  proto:
    name: Proto (codegen drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: ~/.cache/daak-cddl-codegen
          key: cddl-codegen-${{ runner.os }}-${{ env.CDDL_CODEGEN_REV }}
      - run: bash proto/codegen.sh
      - run: git diff --exit-code -- proto/gen
      - run: cargo build --manifest-path proto/gen/rust/ipc/Cargo.toml
