name: CI

# Disabled for now. It runs only when you start it by hand from the Actions tab.
# To enable it again, restore these triggers:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CDDL_CODEGEN_REV: 2fa208e79be241adf2e9fe0e36af18e60bc0943b

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  js:
    name: JS (typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      # packages/core's daemon contract suite drives the real daakd binary over
      # a Unix socket. Without this step that suite silently SKIPS and the
      # in-process/daemon parity gate never runs.
      - run: cargo build -p daakd
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck test

  proto:
    name: Proto (codegen drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/daak-cddl-codegen
          key: cddl-codegen-${{ runner.os }}-${{ env.CDDL_CODEGEN_REV }}
      - run: bash proto/codegen.sh
      - run: git diff --exit-code -- proto/gen
      - run: cargo build --manifest-path proto/gen/rust/ipc/Cargo.toml

  android-ffi:
    name: Android FFI (Linux build, guards the F-Droid build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006"
      # One ABI keeps the job short. The script reads the list from
      # gradle.properties.
      - name: Build libdaak_ffi.so for arm64-v8a
        env:
          DAAK_CARGO_OFFLINE: "0"
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' apps/mobile/android/gradle.properties
          bash apps/mobile/scripts/gen-android-ffi.sh
          test -s apps/mobile/android/app/build/generated/daak-ffi/jniLibs/arm64-v8a/libdaak_ffi.so
