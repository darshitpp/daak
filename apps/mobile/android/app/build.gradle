apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]
    //
    // EMPTY on purpose. The default is ["debug"], which SKIPS JS bundling,
    // so the debug APK carries no bundle and dies at startup with
    // "Unable to load script" unless Metro happens to be running on port
    // 8081 -- measured on the emulator and on a physical phone. The debug APK
    // is the artifact the user installs, so it must stand alone. Setting this
    // to [] makes the bundle task run for every variant.
    debuggableVariants = []

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []
    //
    // NOT the default. Metro runs a pool of child Node processes, one per CPU
    // by default, and each process holds its own heap. On a machine with 8 GiB
    // of RAM that pool is what exhausts memory before the bundle finishes.
    // Two workers bound the peak. Raise this on a machine with more RAM.
    extraPackagerArgs = ['--max-workers', '2']

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

// Release signing input. The keystore password never enters Git. Gradle reads
// apps/mobile/android/keystore.properties when that file exists, else the four
// ANDROID_KEY* environment variables. keystore.properties.example documents
// both forms. When NEITHER source is present, no release signing config is
// made, so :app:assembleRelease writes an UNSIGNED APK instead of a release APK
// silently signed with the debug key -- a debug-signed release still installs
// and still runs, and the user only meets the mistake on the first update, when
// the upload key no longer matches the installed key. Pinned by
// apps/mobile/src/__tests__/androidReleaseSigning.test.ts.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseStoreFile = keystoreProperties.getProperty('storeFile') ?: System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = keystoreProperties.getProperty('storePassword') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = keystoreProperties.getProperty('keyAlias') ?: System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = keystoreProperties.getProperty('keyPassword') ?: System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // Both source sets are produced by apps/mobile/scripts/gen-android-ffi.sh,
    // the Android counterpart of gen-ios-ffi.sh, into build/ (already
    // gitignored). Nothing generated is committed and a clean cannot leave a
    // stale copy behind a green build.
    sourceSets {
        main {
            // daak_ffi.kt: the uniffi_bindgen output DaakModule.kt imports.
            // gen-android-ffi.sh writes it to <out>/uniffi, so this dir must be
            // <out> itself for the uniffi/daak_ffi/ package path to resolve.
            kotlin.srcDirs += ["$buildDir/generated/daak-ffi"]
            // libdaak_ffi.so per ABI, so the APK carries the cdylib uniffi
            // loads through JNA.
            jniLibs.srcDirs += ["$buildDir/generated/daak-ffi/jniLibs"]
        }
    }

    namespace "dev.darshit.daak"
    defaultConfig {
        applicationId "dev.darshit.daak"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }
    splits {
        abi {
            // ABI splits are a RELEASE-only size cut. AGP 8.12 has no
            // per-variant splits API, so the enable flag reads the requested
            // task names. `assembleDebug` names no release task, so the debug
            // variant keeps its single app-debug.apk and the documented debug
            // flow does not change.
            // shortcut: an `assemble` of both variants turns splits on for
            // debug too, replace with a property flag when that flow matters.
            enable gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk true
        }
    }
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.all { output ->
                def version = variant.versionName
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                def newName = abi ? "daak-" + version + "-" + abi + ".apk" : "daak-" + version + "-universal.apk"
                outputFileName = newName
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // No release block at all without the four values above. AGP then has
        // no signature to attach and emits app-release-unsigned.apk.
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // The upload key, never the debug key. See the note at the top of
            // this file. The debug build above keeps signingConfigs.debug.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            // The universal APK must target mobile devices only. splits.abi
            // narrows the per-ABI APKs, but the universal APK otherwise packs
            // every native library present: JNA's armeabi/mips stubs and React
            // Android's x86 builds ride along. abiFilters removes them before
            // packaging, where packaging.excludes cannot (the React plugin's
            // jniLibs pickFirsts re-include its own prefab libs). AGP permits
            // abiFilters beside splits only while universalApk is true.
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        // R65: react-android deliberately EXCLUDES libhermesvm.so from its own
        // AAR, so the VM must come from a separate artifact. An empty branch here
        // ships an APK with libhermestooling.so and no VM beside it, and the app
        // dies in Activity.onCreate with
        // SoLoaderDSONotFoundError: couldn't find DSO to load: libhermesvm.so
        // before React renders anything. Measured on an arm64 emulator, API 36.
        //
        // The GROUP is the load-bearing part. react-native 0.83 moved this
        // artifact to com.facebook.hermes; com.facebook.react:hermes-android
        // stops at 0.82.1 and com.facebook.react:hermes-android:0.83.10 is a 404.
        // The plugin reads the same group out of
        // react-native/ReactAndroid/gradle.properties (react.internal.hermesPublishingGroup)
        // and the same version out of sdks/hermes-engine/version.properties, so
        // 0.14.1 below is HERMES_VERSION_NAME from that file, not the RN version.
        // The plugin also FORCES the same coordinate to that version, so an RN
        // upgrade cannot leave this stale.
        // Pinned by src/__tests__/androidJsEngine.test.ts.
        implementation("com.facebook.hermes:hermes-android:0.14.1")
    } else {
        implementation jscFlavor
    }

    // How the generated uniffi bindings reach the Rust cdylib: they declare
    // their FFI surface as a com.sun.jna.Library and call Native.load. Without
    // JNA every engine method throws UnsatisfiedLinkError at the first call on
    // a device, and nothing at build time notices. uniffi_bindgen 0.28.3 emits
    // no JNA dependency of its own, so the app declares it. Pinned by
    // src/__tests__/androidFfiWiring.test.ts.
    //
    // 5.14.0, NOT the 5.6.0 that was here first, and the version is load-bearing
    // rather than incidental. uniffi 0.28.3's JVM object-cleaner template
    // references com.sun.jna.internal.Cleaner, which JNA DELETED in 5.0 as part
    // of the Java 9 module-encapsulation cleanup: jna 5.6.0's jar contains zero
    // Cleaner classes, so :app:compileDebugKotlin fails with "Unresolved
    // reference: Cleaner" and the failure is in GENERATED code, so it cannot
    // be fixed on the Kotlin side. JNA reintroduced it in 5.13.0 for exactly
    // this reason; 5.14.0 is the current release and ships
    // Cleaner.getCleaner() plus Cleaner$Cleanable.clean(), the precise API the
    // template calls. Bytecode is major version 52 (Java 8), so it is safe on
    // minSdk 24.
    //
    // @aar is LOAD-BEARING, not decoration. jna 5.14.0's POM declares
    // <packaging>jar</packaging>, and that jar carries aix/darwin/linux/sunos/
    // win32 natives and ZERO android-*. JNA's Android build ships as a separate
    // artifact with the SAME coordinates and the .aar extension, holding
    // jni/arm64-v8a/libjnidispatch.so et al. Gradle selects by packaging, so the
    // bare coordinate silently resolves a jar with no Android native in it.
    // Everything still compiles and the app still launches; the engine is just
    // dead, with a device-only
    //   UnsatisfiedLinkError: Native library
    //   (com/sun/jna/android-aarch64/libjnidispatch.so) not found
    // on the first engine call. Measured on an arm64 emulator, 2026-10-01.
    // Pinned by src/__tests__/androidFfiWiring.test.ts.
    implementation("net.java.dev.jna:jna:5.14.0@aar") { transitive = false }
}

// R42s: THE RELEASE JAVASCRIPT BUNDLE MUST BE INVALIDATED BY A WORKSPACE CHANGE.
//
// react-native's Gradle plugin declares the bundle task's inputs under the APP
// alone, while the JavaScript imports from ../../../packages/* and
// ../../../modules/*. Editing packages/ui therefore left
// `createBundleReleaseJsAndAssets` UP-TO-DATE and the APK packaged STALE
// JavaScript. Measured on 2026-10-06: a bundle generated at 21:06 was packaged
// into an APK built at 21:35, and two committed fixes -- the folder row's label
// and its path display -- were missing from the installed app. Nothing failed:
// the build was green and the app ran the old code.
//
// Declared HERE because this is the only file that knows the workspace layout.
// The directories are `optional()` so a checkout without them still configures,
// and each gets a stable property name so Gradle can tell them apart.
def daakWorkspaceInputs = ['packages', 'modules'].collect { file("$rootDir/../../../$it") }
tasks.matching { it.name.toLowerCase().startsWith('createbundle') }.configureEach {
    daakWorkspaceInputs.each { dir ->
        // fileTree, not dir. inputs.dir hashes EVERYTHING under the tree,
        // including node_modules caches and generated build/ output. Those
        // change without a source edit -- for example vitest rewrites
        // packages/*/node_modules/.vite/vitest/results.json -- so a full
        // JavaScript rebundle ran on every build for no source change. The
        // exclusions keep the R42s invalidation and drop the false triggers.
        inputs.files(fileTree(dir) { exclude '**/node_modules/**', '**/build/**' })
              .withPropertyName("daakWorkspace_${dir.name}").optional()
    }
}
