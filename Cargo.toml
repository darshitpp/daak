[workspace]
resolver = "2"
members = ["crates/daak-core", "crates/daak-cli"]
exclude = ["proto/gen"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
thiserror = "2"
tracing = "0.1"
blake2 = "0.10"
rand = "0.8"
mdns-sd = "0.11"
socket2 = "0.5"
futures = "0.3"
hostname = "0.4"
tempfile = "3"
hex = "0.4"
