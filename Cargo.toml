[workspace]
resolver = "2"
members = [
    "crates/daak-core",
    "crates/daak-cli",
    "crates/daak-ffi",
    "crates/daak-ipc",
    "crates/daakd",
]
exclude = ["proto/gen", "crates/daak-core/fuzz"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
thiserror = "2"
tracing = "0.1"
blake2 = "0.10"
rand = "0.8"
mdns-sd = "0.11"
socket2 = "0.5"
futures = "0.3"
hostname = "0.4"
tempfile = "3"
hex = "0.4"
snow = "0.9"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
zeroize = "1"
spake2 = "0.4"
base32 = "0.5"
subtle = "2"
argon2 = "0.5"
getrandom = "0.2"
base64 = "0.22"
