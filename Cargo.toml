[workspace]
resolver = "2"
members = [
    "crates/daak-core",
    "crates/daak-cli",
    "crates/daak-ffi",
    "crates/daak-ipc",
    "crates/daakd",
]
exclude = ["proto/gen", "crates/daak-core/fuzz"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
thiserror = "2"
tracing = "0.1"
blake2 = "0.10"
rand = "0.8"
mdns-sd = "0.11"
socket2 = "0.5"
futures = "0.3"
hostname = "0.4"
tempfile = "3"
hex = "0.4"
snow = { version = "0.9", features = ["risky-raw-split"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
zeroize = "1"
spake2 = "0.4"
base32 = "0.5"
subtle = "2"
argon2 = "0.5"
getrandom = "0.2"
base64 = "0.22"

# mdns-sd 0.11.5 computes get_expiration_time as created + (ttl * percent * 10)
# in u32 (mdns-sd-0.11.5/src/dns_parser.rs:1641). A peer record with a large TTL
# overflows, and a DEBUG build panics on overflow. That panic leaves the Rust
# FFI boundary and aborts the macOS app (crash report
# Daak-2026-10-05-195011.ips, abort through __rust_foreign_exception).
#
# Overload wrap IS the defined behaviour of u32 multiply; the result is only a
# cache expiry. So this override keeps the panic out of a debug build, and it is
# scoped to mdns-sd alone so the rest of the workspace keeps its overflow
# checks. A release build already has overflow-checks off.
#
# Cost if wrong: mdns-sd's expiry math still wraps for a pathological TTL. That
# is a wrong cache expiry, not a crash. R59 records this trade.
[profile.dev.package.mdns-sd]
overflow-checks = false

# The dev and test profiles emit full DWARF by default (debug = 2, "full").
# rustc keeps one object file for each codegen unit in target/debug/deps. In
# this repository that is about 315,000 files and about 20 GiB, and most of it
# is debug info.
#
# Line tables keep the file name and the line number in a backtrace. They drop
# the variable and type DWARF. The workspace crates keep this level.
[profile.dev]
debug = "line-tables-only"

# A dependency does not need debug info. The "*" table matches dependencies
# only, and not workspace members. This removes most of the per-CGU object
# size.
#
# Cost if wrong: you cannot step into a dependency in a debugger. A backtrace
# for workspace code keeps its line numbers.
[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"
