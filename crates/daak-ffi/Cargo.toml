[package]
name = "daak-ffi"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[package.metadata.uniffi]
udl_files = ["src/daak.udl"]

[dependencies]
base64 = "0.22"
daak-core = { path = "../daak-core" }
tokio.workspace = true
serde_json = "1"
thiserror.workspace = true
hex.workspace = true
uniffi = { version = "0.28", features = ["tokio"] }

[dev-dependencies]
tempfile.workspace = true
if-addrs = "0.13"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
