Categories:
  - Connectivity
License: Apache-2.0
AuthorName: Darshit Patel
WebSite: https://github.com/darshitpp/daak
SourceCode: https://github.com/darshitpp/daak
IssueTracker: https://github.com/darshitpp/daak/issues

AutoName: Daak

RepoType: git
Repo: https://github.com/darshitpp/daak.git

Builds:
  - versionName: 0.1.1
    versionCode: 21
    commit: COMMIT_HASH
    timeout: 7200
    subdir: apps/mobile/android
    sudo:
      - apt-get update
      - apt-get install -y rustup nodejs npm build-essential
      - apt-get install -y openjdk-17-jdk-headless
      - npm install -g pnpm@9.12.0
    init:
      - rustup default 1.98.1
      - rustup target add aarch64-linux-android armv7-linux-androideabi
    gradle:
      - yes
    output: app/build/outputs/apk/release/daak-0.1.1-armeabi-v7a.apk
    prebuild:
      - cd ../../..
      - sed -i -e 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a/'
        apps/mobile/android/gradle.properties
      - pnpm install --frozen-lockfile
      - cargo fetch --locked
      - DAAK_CARGO_OFFLINE=0 bash apps/mobile/scripts/gen-android-ffi.sh
    scandelete:
      - node_modules
      - target
    ndk: 27.1.12297006

  - versionName: 0.1.1
    versionCode: 22
    commit: COMMIT_HASH
    timeout: 7200
    subdir: apps/mobile/android
    sudo:
      - apt-get update
      - apt-get install -y rustup nodejs npm build-essential
      - apt-get install -y openjdk-17-jdk-headless
      - npm install -g pnpm@9.12.0
    init:
      - rustup default 1.98.1
      - rustup target add aarch64-linux-android armv7-linux-androideabi
