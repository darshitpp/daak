      - cd ../../..
      - sed -i -e 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/'
        apps/mobile/android/gradle.properties
      - pnpm install --frozen-lockfile
      - cargo fetch --locked
      - DAAK_CARGO_OFFLINE=0 bash apps/mobile/scripts/gen-android-ffi.sh
    scandelete:
      - node_modules
      - target
    ndk: 27.1.12297006

AutoUpdateMode: None
UpdateCheckMode: Tags ^v[0-9.]+$
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
CurrentVersion: 0.1.1
CurrentVersionCode: 22
